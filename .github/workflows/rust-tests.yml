name: Rust tests

# Runs the Rust workspace tests on agent and feature branches, which the
# CI workflow (main and pull requests only) does not cover. Formatting and
# clippy are reported but do not fail the run: older code is not yet
# rustfmt-clean.

on:
  push:
    branches: ["agent/**", "feature/**"]
    paths:
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-tests.yml"
  workflow_dispatch:

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Link-local dial (a dummy interface with a 169.254 address)
        run: |
          sudo ip link add cn0 type dummy
          sudo ip link set cn0 up
          sudo ip addr add 169.254.77.1/16 dev cn0
          sleep 3
          export CONEST_TEST_LL_V4=169.254.77.1
          v6=$(ip -6 -o addr show dev cn0 scope link | awk '{print $4}' | cut -d/ -f1 | head -n1)
          if [ -n "$v6" ]; then
            export CONEST_TEST_LL_V6="$v6"
            export CONEST_TEST_LL_INDEX="$(cat /sys/class/net/cn0/ifindex)"
          fi
          cargo test --locked -p conest_native --lib endpoints_with_relays_off_connect_by_a_link_local_address -- --ignored --nocapture
      - name: Bluetooth hostile-input sabotage checks
        run: python3 tool/m37_rust_sabotage.py
      - name: M36 audio behavior negative checks
        if: github.ref == 'refs/heads/agent/m36-group-calls'
        run: python3 tool/m36_rust_sabotage.py
      - name: Formatting of changed files (report only)
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=200 origin feature/matrix-client || true
          changed=$(git diff --name-only --diff-filter=AM origin/feature/matrix-client...HEAD -- '*.rs' || true)
          if [ -n "$changed" ]; then rustfmt --edition 2024 --check $changed; fi
      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
