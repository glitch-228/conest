name: Tor compile check

on:
  push:
    branches: [ci/tor-compile]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tor-check
      - run: cargo check --locked --manifest-path native/conest_native/Cargo.toml 2>&1 | tail -150
        shell: bash
      - run: cargo check --locked --manifest-path native/conest_native/Cargo.toml
