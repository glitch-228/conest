name: Debug artifacts

on:
  workflow_dispatch:
    inputs:
      quick_build:
        description: "Build interim tester artifacts without qualification tests (milestone checkpoint required)"
        type: boolean
        default: false
      milestone_checkpoint:
        description: "Required for quick builds: quarter, half, or complete"
        type: choice
        options:
          - none
          - quarter
          - half
          - complete
        default: none
      milestone_id:
        description: "PLAN milestone checkpoint ID, for example M4-Q1 or M4-COMPLETE"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  DEBUG_TAG: debug-${{ github.run_number }}-${{ github.sha }}

jobs:
  cadence:
    name: Check debug cadence
    runs-on: ubuntu-latest
    steps:
      - name: Reject an unqualified quick build without a milestone checkpoint
        if: ${{ inputs.quick_build && (inputs.milestone_checkpoint == 'none' || inputs.milestone_id == '') }}
        run: |
          echo "::error title=Milestone checkpoint required::Quick debug artifacts are reserved for quarter, half, or complete PLAN milestones."
          echo "Set milestone_checkpoint and milestone_id (for example M4-Q1) before dispatching quick_build."
          exit 1
      - name: Validate the milestone identifier
        if: ${{ inputs.quick_build }}
        env:
          CHECKPOINT: ${{ inputs.milestone_checkpoint }}
          MILESTONE_ID: ${{ inputs.milestone_id }}
        run: |
          case "$CHECKPOINT" in
            quarter)
              pattern='^M[0-9]+-Q[1-4]$'
              ;;
            half)
              pattern='^M[0-9]+-HALF$'
              ;;
            complete)
              pattern='^M[0-9]+-COMPLETE$'
              ;;
            *)
              echo "::error title=Invalid milestone checkpoint::Quick builds accept quarter, half, or complete checkpoints only."
              exit 1
              ;;
          esac
          if [[ ! "$MILESTONE_ID" =~ $pattern ]]; then
            echo "::error title=Invalid milestone identifier::Use M<number>-Q1..Q4 for quarter, M<number>-HALF for half, or M<number>-COMPLETE for a finished milestone."
            exit 1
          fi
      - name: Record the requested cadence
        run: |
          if [ "${{ inputs.quick_build }}" = "true" ]; then
            echo "Quick debug checkpoint: ${{ inputs.milestone_id }} (${{ inputs.milestone_checkpoint }})"
          else
            echo "Qualified debug artifact: full verification enabled"
          fi

  verify:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Verify debug transfers and storage controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Verify desktop Bluetooth links and hostile-input negative checks
        run: |
          flutter test test/desktop_bitchat_links_test.dart
          python3 tool/m37_dart_sabotage.py
      - name: Verify channel identity and automatic transfer handshake
        run: |
          flutter test test/build_info_test.dart test/transport_test.dart test/feature_models_test.dart test/voice_call_sound_cues_test.dart
      - name: Verify encrypted group calls and shared audio ownership
        run: |
          flutter test test/group_call_test.dart test/group_call_crypto_test.dart test/group_call_topology_test.dart test/group_call_recovery_test.dart test/group_call_admission_repair_test.dart test/group_call_pending_key_test.dart test/group_call_media_ownership_test.dart test/group_call_screen_test.dart test/voice_noise_suppression_test.dart test/ratchet_concurrent_read_test.dart
          flutter test test/messenger_controller_test.dart --plain-name 'group-only members join encrypted voice calls over Iroh'
          flutter test test/messenger_controller_test.dart --name 'group-only call keys survive handoff over a carrier|group-only hello duplicates and cache-evicted replays preserve call keys|group-only ratchet controls enforce identity privacy and resource bounds|account revocation .* group call'
          flutter test test/messenger_controller_test.dart --plain-name 'empty group ticks preserve a live Android 1:1 foreground call'
          flutter test test/messenger_controller_test.dart --plain-name 'repeated group service replacements retain every pending hardware cleanup'
          flutter test test/group_history_test.dart test/group_history_sync_test.dart test/group_history_wire_test.dart test/group_membership_history_test.dart test/storage_test.dart test/group_file_crypto_test.dart test/ratchet_test.dart test/matrix_carrier_test.dart
          flutter test test/storage_capacity_test.dart test/lan_direct_test.dart test/attachment_file_io_test.dart test/attachment_block_worker_test.dart test/tor_carrier_test.dart test/bitchat_test.dart
          flutter test test/messenger_controller_test.dart \
            --name "Iroh group admission|Iroh group history|Iroh group-only|real socket group-only|legacy group updates|retired default|Iroh pairing|Iroh bootstrap|storage reserve|Download anyway|manual Download storage|spool reserve|Beam pairing receives|rejected contact messages|discarded message duplicates|Contact approval releases locally queued messages|cancelled pairing ignores a late acceptance response|Iroh limit blocks|automatic online file|different-network|verification progress|repeated LAN hints|chat folders|scheduled messages recover|scheduled messages recheck|scheduled sends stay blocked after revocation|group poll converges after reordered|contact request stays queued|unknown exchange requires approval|double tap|sendMessage prefers LAN routes|heartbeat|queued controls keep plaintext|malformed queued payload|forward-secret sessions|Matrix carrier|Tor carrier|Bluetooth mesh carrier|Courier search keeps archived chats in the archive view"
          flutter test test/messenger_controller_test.dart \
            --plain-name "matching debug builds auto-accept, verify, report, and clean a real LAN test"
          flutter test test/messenger_controller_test.dart \
            --plain-name "automatic file test stops before sending when debug builds differ"
      - name: Verify Delta Chat files and signed message changes
        run: |
          flutter test test/delta_mail_test.dart test/delta_protocol_test.dart test/delta_content_test.dart test/delta_content_widgets_test.dart test/delta_parser_limits_test.dart test/delta_avatar_store_test.dart test/pgp_test.dart test/email_carrier_test.dart
          flutter test test/messenger_controller_test.dart --plain-name "Delta"
      - name: Verify the XMPP client and carrier
        run: |
          flutter test test/xmpp_test.dart
          flutter test test/messenger_controller_test.dart --plain-name "XMPP"

  matrix:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Matrix carrier and client against a real Synapse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev libdbus-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: matrix-native
      - run: flutter pub get
      - name: Build the native library with the Matrix client
        run: |
          cargo build --locked --release \
            --manifest-path native/conest_native/Cargo.toml
      - name: Start Synapse with open registration
        run: |
          mkdir -p synapse-data
          docker run --rm -v "$PWD/synapse-data:/data" \
            -e SYNAPSE_SERVER_NAME=localhost -e SYNAPSE_REPORT_STATS=no \
            matrixdotorg/synapse:latest generate
          # The generated file may not end with a newline.
          echo | sudo tee -a synapse-data/homeserver.yaml > /dev/null
          sudo tee -a synapse-data/homeserver.yaml > /dev/null <<'EOF'
          enable_registration: true
          enable_registration_without_verification: true
          rc_registration:
            per_second: 100
            burst_count: 100
          rc_login:
            address:
              per_second: 100
              burst_count: 100
            account:
              per_second: 100
              burst_count: 100
          EOF
          sudo tail -n 20 synapse-data/homeserver.yaml
          docker run -d --name synapse -p 8008:8008 \
            -v "$PWD/synapse-data:/data" matrixdotorg/synapse:latest
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8008/_matrix/client/versions && exit 0
            sleep 2
          done
          docker logs synapse
          exit 1
      - name: Run the carrier and the native client against Synapse
        env:
          CONEST_MATRIX_HOMESERVER: http://localhost:8008
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/target/release/libconest_native.so
        run: |
          flutter test test/matrix_homeserver_test.dart
          flutter test test/matrix_client_native_test.dart
      - name: Synapse logs on failure
        if: failure()
        run: docker logs synapse | tail -200

  tor:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Tor carrier over the real Tor network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev libdbus-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: matrix-native
      - run: flutter pub get
      - name: Build the native library with Tor
        run: |
          cargo build --locked --release \
            --manifest-path native/conest_native/Cargo.toml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/conest-lyrebird
          key: lyrebird-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tool/build_lyrebird.sh') }}
      - name: Build lyrebird and fetch obfs4 bridges
        run: |
          tool/build_lyrebird.sh linux-x64 "$RUNNER_TEMP/lyrebird"
          # Tor's default bridges for censored users (Moat API); when Moat
          # is down the bridge test is skipped rather than failing the job.
          (curl -sf --max-time 60 -X POST \
            -H 'Content-Type: application/vnd.api+json' \
            -d '{"transports":["obfs4"]}' \
            https://bridges.torproject.org/moat/circumvention/defaults \
            | jq -r '.settings[].bridges.bridge_strings // [] | .[]' \
            > "$RUNNER_TEMP/bridges.txt") || : > "$RUNNER_TEMP/bridges.txt"
          wc -l "$RUNNER_TEMP/bridges.txt"
      - name: Send frames through this device's own onion service, then over obfs4
        env:
          CONEST_TOR_LIVE: "1"
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/target/release/libconest_native.so
        run: |
          export CONEST_TOR_TRANSPORT="$RUNNER_TEMP/lyrebird"
          export CONEST_TOR_BRIDGES="$(cat "$RUNNER_TEMP/bridges.txt")"
          flutter test test/tor_live_test.dart

  nostr:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Nostr carrier against real relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start nostr-rs-relay and strfry
        run: |
          # Pinned: nostr-rs-relay 0.10.0 and strfry 1.1.3.
          docker run -d --name nostr-rs-relay -p 7000:8080 \
            scsibug/nostr-rs-relay@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
          # The image's write policy only accepts whitelisted keys; accept
          # everything, as a public relay does.
          cat > accept-all.py <<'PY'
          #!/usr/bin/env python3
          import json, sys
          for line in sys.stdin:
              request = json.loads(line)
              print(json.dumps({"id": request["event"]["id"], "action": "accept"}), flush=True)
          PY
          chmod 755 accept-all.py
          # strfry keeps its LMDB database in /app/strfry-db.
          docker run -d --name strfry -p 7777:7777 \
            -v "$PWD/accept-all.py:/app/write-policy.py:ro" \
            --tmpfs /app/strfry-db:rw,mode=1777 \
            --ulimit nofile=524288:524288 \
            dockurr/strfry@sha256:599ab3500dbfbe6cb78c668e1892cd9802c192d066df4660e8e3175034a8344d
          for port in 7000 7777; do
            ready=
            for attempt in $(seq 1 60); do
              if curl -sf -H 'Accept: application/nostr+json' \
                "http://localhost:$port"; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "Relay on port $port did not start"
              docker logs nostr-rs-relay | tail -50
              docker logs strfry | tail -50
              exit 1
            fi
          done
      - name: Run the carrier against each relay
        run: |
          for relay in ws://localhost:7000 ws://localhost:7777; do
            echo "::group::$relay"
            CONEST_NOSTR_RELAY=$relay flutter test test/nostr_relay_live_test.dart
            echo "::endgroup::"
          done
      - name: Relay logs on failure
        if: failure()
        run: |
          docker logs nostr-rs-relay | tail -100
          docker logs strfry | tail -100

  email:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Email carrier against a real mail server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start GreenMail (accounts created on first login)
        run: |
          # Pinned: GreenMail 2.1.14.
          docker run -d --name greenmail -p 3025:3025 -p 3143:3143 \
            -e GREENMAIL_OPTS='-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose' \
            greenmail/standalone@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/3143) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs greenmail | tail -50
          exit 1
      - name: Run the carrier against GreenMail
        env:
          CONEST_MAIL_HOST: localhost
        run: flutter test test/email_live_test.dart
      - name: GreenMail logs on failure
        if: failure()
        run: docker logs greenmail | tail -200

  xmpp:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: XMPP carrier against a real Prosody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start Prosody with in-band registration
        run: |
          # Ubuntu's Prosody 0.12 (the Docker Hub image stopped at 0.11).
          sudo apt-get update
          sudo apt-get install -y prosody
          sudo tee /etc/prosody/prosody.cfg.lua > /dev/null <<'EOF'
          admins = { }
          modules_enabled = {
            "roster"; "saslauth"; "tls"; "disco"; "ping"; "register";
            "smacks"; "carbons"; "csi_simple"; "offline"; "mam";
            "websocket"; "blocklist"; "pep"; "private"; "vcard4";
          }
          allow_registration = true
          min_seconds_between_registrations = 0
          registration_throttle_max = 1000
          registration_throttle_period = 60
          c2s_require_encryption = false
          allow_unencrypted_plain_auth = false
          authentication = "internal_hashed"
          storage = "internal"
          http_ports = { 5280 }
          http_interfaces = { "*" }
          https_ports = { }
          consider_websocket_secure = true
          cross_domain_websocket = true
          log = { info = "/var/log/prosody/prosody.log" }
          pidfile = "/run/prosody/prosody.pid"
          VirtualHost "localhost"
          Component "conference.localhost" "muc"
          EOF
          sudo prosodyctl check config || true
          sudo systemctl restart prosody
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/5222) 2>/dev/null; then
              prosodyctl about | head -5 || true
              exit 0
            fi
            sleep 2
          done
          sudo tail -50 /var/log/prosody/prosody.log
          exit 1
      - name: Run the XMPP client and carrier against Prosody
        env:
          CONEST_XMPP_HOST: localhost
          CONEST_XMPP_DOMAIN: localhost
        run: flutter test test/xmpp_live_test.dart
      - name: Prosody logs on failure
        if: failure()
        run: sudo tail -200 /var/log/prosody/prosody.log

  reticulum:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Reticulum carrier against the Python reference (RNS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Install Reticulum (pinned)
        run: |
          python3 -m venv rns-venv
          rns-venv/bin/pip install --quiet rns==1.5.6
          rns-venv/bin/python -c "import RNS"
      - name: Run the interop tests
        env:
          CONEST_RNS_PYTHON: ${{ github.workspace }}/rns-venv/bin/python
        run: flutter test test/reticulum_interop_test.dart

  meshtastic:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Meshtastic carrier against meshtasticd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start meshtasticd in simulation (pinned 2.7.26)
        run: |
          docker run -d --name meshtasticd -p 4403:4403 \
            meshtastic/meshtasticd@sha256:23e92b1331a3a471eaef0c63cbca4365ca40b3111a9781cfdbe5a5114e5773d4 \
            meshtasticd -s
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/4403) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs meshtasticd | tail -50
          exit 1
      - name: Run the client against it
        env:
          CONEST_MESHTASTIC_HOST: localhost
        run: flutter test test/meshtastic_live_test.dart
      - name: meshtasticd logs on failure
        if: failure()
        run: docker logs meshtasticd | tail -200

  relay-installer:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Relay installer (shellcheck, and a real install without systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh tool/install_relay.sh
      - name: Install the newest nightly relay in a fresh container, then run it
        env:
          KEY: ${{ secrets.CONEST_RELEASE_MANIFEST_PUBLIC_KEY }}
        run: |
          docker run --rm -e KEY -v "$PWD/tool:/tool:ro" debian:12 sh -ec '
            apt-get update -qq
            apt-get install -y -qq curl openssl ca-certificates >/dev/null
            sh /tool/install_relay.sh --yes --channel nightly --release-key "$KEY"
            test -x /opt/conest-relay/conest_relay
            id conest-relay
            /opt/conest-relay/conest_relay 127.0.0.1:7667 \
              --identity-seed-path /tmp/seed --database-path /tmp/relay.db &
            for i in $(seq 1 20); do
              curl -fsS http://127.0.0.1:7667/health && exit 0
              sleep 1
            done
            exit 1'

  android:
    name: Android debug battle-test APK
    # Built alongside verify (which still decides the run's result) rather
    # than after it.
    needs: cadence
    runs-on: ubuntu-latest
    env:
      CON_ANDROID_TARGETS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the release APK, which builds the same library.
          shared-key: android-native
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/conest-lyrebird
          key: lyrebird-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tool/build_lyrebird.sh') }}
      - run: flutter pub get
      - name: Install the Android NDK (retried)
        # Gradle downloads it on its own otherwise, and that download came
        # back corrupt in two of four runs ("Archive is not a ZIP archive").
        # The version Flutter's Gradle plugin asks for (flutter.ndkVersion).
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            yes | "$sdkmanager" --install "ndk;28.2.13676358" > /dev/null && exit 0
            echo "NDK install attempt $attempt failed; retrying."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 10
          done
          exit 1
      - name: Build Tor's pluggable transports
        run: tool/build_lyrebird.sh android-arm64 build/app/lyrebirdJniLibs/arm64-v8a/liblyrebird.so
      - name: Build isolated debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true \
            --dart-define=CONEST_EXPERIMENTAL_ANDROID_BACKGROUND_RUNTIME=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/conest-debug-android-arm64-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-android-arm64-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          # Already compressed.
          compression-level: 0

  linux:
    name: Linux debug battle-test bundle
    # Built alongside verify (which still decides the run's result) rather
    # than after it.
    needs: cadence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libasound2-dev libdbus-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-debug
          # The bundle build reuses this target directory: cache it, not ./target.
          workspaces: ". -> build/linux/x64/profile/conest_native_target"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/conest-lyrebird
          key: lyrebird-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tool/build_lyrebird.sh') }}
      - run: flutter pub get
      - name: Build Linux native library with visible Rust diagnostics
        run: |
          cargo build --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            --release
      - name: Test native Opus, adaptive jitter and ratchet behavior
        run: |
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            audio::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            voice_recording::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            api::tests::stalled_media_dial_drops_expired_datagram_without_blocking_messages
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            ratchet::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            matrix::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/profile/conest_native_target \
            transfer::tests
      - name: Build Linux debug bundle
        run: |
          flutter config --enable-linux-desktop
          # Profile, not debug: compiled ahead of time like what users run,
          # so lab timings and battery or CPU use mean something (a debug
          # build is JIT, and idled at a sixth of a core); the VM service
          # stays for CPU profiles. Lab runs follow the debug channel.
          flutter build linux --profile \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true
          tool/build_lyrebird.sh linux-x64 build/linux/x64/profile/bundle/lyrebird
          mkdir -p dist-stage/conest-debug-linux-x64 dist
          cp -a build/linux/x64/profile/bundle/. dist-stage/conest-debug-linux-x64/
          (cd dist-stage && zip -r ../dist/conest-debug-linux-x64-${GITHUB_RUN_NUMBER}.zip conest-debug-linux-x64)
      - name: Test forward-secrecy sessions against the native library
        env:
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/build/linux/x64/profile/bundle/lib/libconest_native.so
          CONEST_REQUIRE_NATIVE_RATCHET: "1"
        run: flutter test test/ratchet_test.dart
      - name: Qualify native group transports
        if: ${{ !inputs.quick_build }}
        env:
          CONEST_RUN_IROH_GROUP_CERT: "1"
          CONEST_RELAY_TEST_BINARY: ${{ github.workspace }}/target/debug/conest_relay
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/linux/x64/profile/bundle/lib
        run: |
          cargo build -p conest_relay --locked
          flutter test test/messenger_controller_test.dart \
            --name "Iroh group admission|Iroh group history|Iroh group-only|real socket group-only"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-linux-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          # Already compressed.
          compression-level: 0

  windows:
    name: Windows debug battle-test bundle
    # Built alongside verify (which still decides the run's result) rather
    # than after it.
    needs: cadence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the release bundle, which builds the same library.
          shared-key: windows-native
          workspaces: ". -> build/windows/x64/conest_native_target"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/conest-lyrebird
          key: lyrebird-${{ runner.os }}-${{ github.job }}-${{ hashFiles('tool/build_lyrebird.sh') }}
      - run: flutter pub get
      # No separate cargo build first: the bundle's CMake build runs cargo
      # under MSBuild's environment, whose compiler variables differ from
      # this shell's, so each build invalidated the other's C dependencies
      # (aws-lc, ring, zstd...) and both rebuilt them every run.
      - name: Build Windows debug bundle
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          # Profile, as on Linux: lab numbers from what users run.
          flutter build windows --profile \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true
          tool/build_lyrebird.sh windows-x64 build/windows/x64/runner/Profile/lyrebird.exe
          mkdir -p dist-stage/conest-debug-windows-x64 dist
          cp -a build/windows/x64/runner/Profile/. dist-stage/conest-debug-windows-x64/
          powershell -Command "Compress-Archive -Path dist-stage/conest-debug-windows-x64 -DestinationPath dist/conest-debug-windows-x64-${GITHUB_RUN_NUMBER}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-windows-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          # Already compressed.
          compression-level: 0
