name: Debug artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  DEBUG_TAG: debug-${{ github.run_number }}-${{ github.sha }}

jobs:
  verify:
    name: Verify debug transfers and storage controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Verify channel identity and automatic transfer handshake
        run: |
          flutter test test/build_info_test.dart
          flutter test test/storage_capacity_test.dart
          flutter test test/messenger_controller_test.dart \
            --name "storage reserve|Download anyway|manual Download storage|spool reserve"
          flutter test test/messenger_controller_test.dart \
            --plain-name "matching debug builds auto-accept, verify, report, and clean a real LAN test"
          flutter test test/messenger_controller_test.dart \
            --plain-name "automatic file test stops before sending when debug builds differ"

  android:
    name: Android debug battle-test APK
    needs: verify
    runs-on: ubuntu-latest
    env:
      CON_ANDROID_TARGETS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-debug
      - run: flutter pub get
      - name: Build isolated debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/conest-debug-android-arm64-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-android-arm64-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux debug battle-test bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-debug
      - run: flutter pub get
      - name: Build Linux debug bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --debug \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA}
          mkdir -p dist-stage/conest-debug-linux-x64 dist
          cp -a build/linux/x64/debug/bundle/. dist-stage/conest-debug-linux-x64/
          (cd dist-stage && zip -r ../dist/conest-debug-linux-x64-${GITHUB_RUN_NUMBER}.zip conest-debug-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-linux-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows debug battle-test bundle
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-debug
      - run: flutter pub get
      - name: Build Windows debug bundle
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --debug \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA}
          mkdir -p dist-stage/conest-debug-windows-x64 dist
          cp -a build/windows/x64/runner/Debug/. dist-stage/conest-debug-windows-x64/
          powershell -Command "Compress-Archive -Path dist-stage/conest-debug-windows-x64 -DestinationPath dist/conest-debug-windows-x64-${GITHUB_RUN_NUMBER}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-windows-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
