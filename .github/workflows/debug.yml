name: Debug artifacts

on:
  workflow_dispatch:
    inputs:
      quick_build:
        description: "Build interim tester artifacts without qualification tests (milestone checkpoint required)"
        type: boolean
        default: false
      milestone_checkpoint:
        description: "Required for quick builds: quarter, half, or complete"
        type: choice
        options:
          - none
          - quarter
          - half
          - complete
        default: none
      milestone_id:
        description: "PLAN milestone checkpoint ID, for example M4-Q1 or M4-COMPLETE"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  DEBUG_TAG: debug-${{ github.run_number }}-${{ github.sha }}

jobs:
  cadence:
    name: Check debug cadence
    runs-on: ubuntu-latest
    steps:
      - name: Reject an unqualified quick build without a milestone checkpoint
        if: ${{ inputs.quick_build && (inputs.milestone_checkpoint == 'none' || inputs.milestone_id == '') }}
        run: |
          echo "::error title=Milestone checkpoint required::Quick debug artifacts are reserved for quarter, half, or complete PLAN milestones."
          echo "Set milestone_checkpoint and milestone_id (for example M4-Q1) before dispatching quick_build."
          exit 1
      - name: Validate the milestone identifier
        if: ${{ inputs.quick_build }}
        env:
          CHECKPOINT: ${{ inputs.milestone_checkpoint }}
          MILESTONE_ID: ${{ inputs.milestone_id }}
        run: |
          case "$CHECKPOINT" in
            quarter)
              pattern='^M[0-9]+-Q[1-4]$'
              ;;
            half)
              pattern='^M[0-9]+-HALF$'
              ;;
            complete)
              pattern='^M[0-9]+-COMPLETE$'
              ;;
            *)
              echo "::error title=Invalid milestone checkpoint::Quick builds accept quarter, half, or complete checkpoints only."
              exit 1
              ;;
          esac
          if [[ ! "$MILESTONE_ID" =~ $pattern ]]; then
            echo "::error title=Invalid milestone identifier::Use M<number>-Q1..Q4 for quarter, M<number>-HALF for half, or M<number>-COMPLETE for a finished milestone."
            exit 1
          fi
      - name: Record the requested cadence
        run: |
          if [ "${{ inputs.quick_build }}" = "true" ]; then
            echo "Quick debug checkpoint: ${{ inputs.milestone_id }} (${{ inputs.milestone_checkpoint }})"
          else
            echo "Qualified debug artifact: full verification enabled"
          fi

  verify:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Verify debug transfers and storage controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Verify channel identity and automatic transfer handshake
        run: |
          flutter test test/build_info_test.dart test/transport_test.dart test/feature_models_test.dart test/voice_call_sound_cues_test.dart
          flutter test test/group_history_test.dart test/group_history_sync_test.dart test/group_history_wire_test.dart test/group_membership_history_test.dart test/storage_test.dart test/group_file_crypto_test.dart test/ratchet_test.dart test/matrix_carrier_test.dart
          flutter test test/storage_capacity_test.dart test/lan_direct_test.dart test/attachment_file_io_test.dart test/attachment_block_worker_test.dart test/tor_carrier_test.dart test/bitchat_test.dart
          flutter test test/messenger_controller_test.dart \
            --name "Iroh group admission|Iroh group history|Iroh group-only|real socket group-only|legacy group updates|retired default|Iroh pairing|Iroh bootstrap|storage reserve|Download anyway|manual Download storage|spool reserve|Beam pairing receives|rejected contact messages|discarded message duplicates|Contact approval releases locally queued messages|cancelled pairing ignores a late acceptance response|Iroh limit blocks|automatic online file|different-network|verification progress|repeated LAN hints|chat folders|scheduled messages recover|scheduled messages recheck|scheduled sends stay blocked after revocation|group poll converges after reordered|contact request stays queued|unknown exchange requires approval|double tap|sendMessage prefers LAN routes|heartbeat|queued controls keep plaintext|malformed queued payload|forward-secret sessions|Matrix carrier|Tor carrier|Bluetooth mesh carrier|Courier search keeps archived chats in the archive view"
          flutter test test/messenger_controller_test.dart \
            --plain-name "matching debug builds auto-accept, verify, report, and clean a real LAN test"
          flutter test test/messenger_controller_test.dart \
            --plain-name "automatic file test stops before sending when debug builds differ"

  matrix:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Matrix carrier and client against a real Synapse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: matrix-native
      - run: flutter pub get
      - name: Build the native library with the Matrix client
        run: |
          cargo build --locked --release \
            --manifest-path native/conest_native/Cargo.toml
      - name: Start Synapse with open registration
        run: |
          mkdir -p synapse-data
          docker run --rm -v "$PWD/synapse-data:/data" \
            -e SYNAPSE_SERVER_NAME=localhost -e SYNAPSE_REPORT_STATS=no \
            matrixdotorg/synapse:latest generate
          # The generated file may not end with a newline.
          echo | sudo tee -a synapse-data/homeserver.yaml > /dev/null
          sudo tee -a synapse-data/homeserver.yaml > /dev/null <<'EOF'
          enable_registration: true
          enable_registration_without_verification: true
          rc_registration:
            per_second: 100
            burst_count: 100
          rc_login:
            address:
              per_second: 100
              burst_count: 100
            account:
              per_second: 100
              burst_count: 100
          EOF
          sudo tail -n 20 synapse-data/homeserver.yaml
          docker run -d --name synapse -p 8008:8008 \
            -v "$PWD/synapse-data:/data" matrixdotorg/synapse:latest
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8008/_matrix/client/versions && exit 0
            sleep 2
          done
          docker logs synapse
          exit 1
      - name: Run the carrier and the native client against Synapse
        env:
          CONEST_MATRIX_HOMESERVER: http://localhost:8008
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/target/release/libconest_native.so
        run: |
          flutter test test/matrix_homeserver_test.dart
          flutter test test/matrix_client_native_test.dart
      - name: Synapse logs on failure
        if: failure()
        run: docker logs synapse | tail -200

  tor:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Tor carrier over the real Tor network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: matrix-native
      - run: flutter pub get
      - name: Build the native library with Tor
        run: |
          cargo build --locked --release \
            --manifest-path native/conest_native/Cargo.toml
      - name: Send frames through this device's own onion service
        env:
          CONEST_TOR_LIVE: "1"
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/target/release/libconest_native.so
        run: flutter test test/tor_live_test.dart

  nostr:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Nostr carrier against real relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start nostr-rs-relay and strfry
        run: |
          # Pinned: nostr-rs-relay 0.10.0 and strfry 1.1.3.
          docker run -d --name nostr-rs-relay -p 7000:8080 \
            scsibug/nostr-rs-relay@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
          # The image's write policy only accepts whitelisted keys; accept
          # everything, as a public relay does.
          cat > accept-all.py <<'PY'
          #!/usr/bin/env python3
          import json, sys
          for line in sys.stdin:
              request = json.loads(line)
              print(json.dumps({"id": request["event"]["id"], "action": "accept"}), flush=True)
          PY
          chmod 755 accept-all.py
          # strfry keeps its LMDB database in /app/strfry-db.
          docker run -d --name strfry -p 7777:7777 \
            -v "$PWD/accept-all.py:/app/write-policy.py:ro" \
            --tmpfs /app/strfry-db:rw,mode=1777 \
            --ulimit nofile=524288:524288 \
            dockurr/strfry@sha256:599ab3500dbfbe6cb78c668e1892cd9802c192d066df4660e8e3175034a8344d
          for port in 7000 7777; do
            ready=
            for attempt in $(seq 1 60); do
              if curl -sf -H 'Accept: application/nostr+json' \
                "http://localhost:$port"; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "Relay on port $port did not start"
              docker logs nostr-rs-relay | tail -50
              docker logs strfry | tail -50
              exit 1
            fi
          done
      - name: Run the carrier against each relay
        run: |
          for relay in ws://localhost:7000 ws://localhost:7777; do
            echo "::group::$relay"
            CONEST_NOSTR_RELAY=$relay flutter test test/nostr_relay_live_test.dart
            echo "::endgroup::"
          done
      - name: Relay logs on failure
        if: failure()
        run: |
          docker logs nostr-rs-relay | tail -100
          docker logs strfry | tail -100

  email:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Email carrier against a real mail server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start GreenMail (accounts created on first login)
        run: |
          # Pinned: GreenMail 2.1.14.
          docker run -d --name greenmail -p 3025:3025 -p 3143:3143 \
            -e GREENMAIL_OPTS='-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose' \
            greenmail/standalone@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/3143) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs greenmail | tail -50
          exit 1
      - name: Run the carrier against GreenMail
        env:
          CONEST_MAIL_HOST: localhost
        run: flutter test test/email_live_test.dart
      - name: GreenMail logs on failure
        if: failure()
        run: docker logs greenmail | tail -200

  reticulum:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Reticulum carrier against the Python reference (RNS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Install Reticulum (pinned)
        run: |
          python3 -m venv rns-venv
          rns-venv/bin/pip install --quiet rns==1.5.6
          rns-venv/bin/python -c "import RNS"
      - name: Run the interop tests
        env:
          CONEST_RNS_PYTHON: ${{ github.workspace }}/rns-venv/bin/python
        run: flutter test test/reticulum_interop_test.dart

  meshtastic:
    if: ${{ !inputs.quick_build }}
    needs: cadence
    name: Meshtastic carrier against meshtasticd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Start meshtasticd in simulation (pinned 2.7.26)
        run: |
          docker run -d --name meshtasticd -p 4403:4403 \
            meshtastic/meshtasticd@sha256:23e92b1331a3a471eaef0c63cbca4365ca40b3111a9781cfdbe5a5114e5773d4 \
            meshtasticd -s
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/4403) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs meshtasticd | tail -50
          exit 1
      - name: Run the client against it
        env:
          CONEST_MESHTASTIC_HOST: localhost
        run: flutter test test/meshtastic_live_test.dart
      - name: meshtasticd logs on failure
        if: failure()
        run: docker logs meshtasticd | tail -200

  android:
    name: Android debug battle-test APK
    needs: [cadence, verify]
    if: ${{ always() && !cancelled() && needs.cadence.result == 'success' && (needs.verify.result == 'success' || (inputs.quick_build && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-latest
    env:
      CON_ANDROID_TARGETS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-debug
      - run: flutter pub get
      - name: Build isolated debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true \
            --dart-define=CONEST_EXPERIMENTAL_ANDROID_BACKGROUND_RUNTIME=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/conest-debug-android-arm64-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-android-arm64-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux debug battle-test bundle
    needs: [cadence, verify]
    if: ${{ always() && !cancelled() && needs.cadence.result == 'success' && (needs.verify.result == 'success' || (inputs.quick_build && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libasound2-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-debug
      - run: flutter pub get
      - name: Build Linux native library with visible Rust diagnostics
        run: |
          cargo build --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            --release
      - name: Test native Opus, adaptive jitter and ratchet behavior
        run: |
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            audio::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            voice_recording::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            api::tests::stalled_media_dial_drops_expired_datagram_without_blocking_messages
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            ratchet::tests
          cargo test --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/linux/x64/debug/conest_native_target \
            matrix::tests
      - name: Build Linux debug bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --debug \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true
          mkdir -p dist-stage/conest-debug-linux-x64 dist
          cp -a build/linux/x64/debug/bundle/. dist-stage/conest-debug-linux-x64/
          (cd dist-stage && zip -r ../dist/conest-debug-linux-x64-${GITHUB_RUN_NUMBER}.zip conest-debug-linux-x64)
      - name: Test forward-secrecy sessions against the native library
        env:
          CONEST_NATIVE_LIBRARY: ${{ github.workspace }}/build/linux/x64/debug/bundle/lib/libconest_native.so
          CONEST_REQUIRE_NATIVE_RATCHET: "1"
        run: flutter test test/ratchet_test.dart
      - name: Qualify native group transports
        if: ${{ !inputs.quick_build }}
        env:
          CONEST_RUN_IROH_GROUP_CERT: "1"
          CONEST_RELAY_TEST_BINARY: ${{ github.workspace }}/target/debug/conest_relay
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/linux/x64/debug/bundle/lib
        run: |
          cargo build -p conest_relay --locked
          flutter test test/messenger_controller_test.dart \
            --name "Iroh group admission|Iroh group history|Iroh group-only|real socket group-only"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-linux-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows debug battle-test bundle
    needs: [cadence, verify]
    if: ${{ always() && !cancelled() && needs.cadence.result == 'success' && (needs.verify.result == 'success' || (inputs.quick_build && needs.verify.result == 'skipped')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-debug
      - run: flutter pub get
      - name: Build Windows native library with visible Rust diagnostics
        shell: bash
        run: |
          cargo build --locked \
            --manifest-path native/conest_native/Cargo.toml \
            --target-dir build/windows/x64/conest_native_target \
            --release
      - name: Build Windows debug bundle
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --debug \
            --dart-define=CONEST_BUILD_TAG=${DEBUG_TAG} \
            --dart-define=CONEST_BUILD_CHANNEL=debug \
            --dart-define=CONEST_BUILD_COMMIT=${GITHUB_SHA} \
            --dart-define=CONEST_EXPERIMENTAL_VOICE_CALLS=true \
            --dart-define=CONEST_FORWARD_SECRECY=true \
            --dart-define=CONEST_MATRIX=true
          mkdir -p dist-stage/conest-debug-windows-x64 dist
          cp -a build/windows/x64/runner/Debug/. dist-stage/conest-debug-windows-x64/
          powershell -Command "Compress-Archive -Path dist-stage/conest-debug-windows-x64 -DestinationPath dist/conest-debug-windows-x64-${GITHUB_RUN_NUMBER}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: conest-debug-windows-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
