name: conest
description: "Cross-platform secure text exchange prototype."
publish_to: 'none'
version: 0.3.5+31

environment:
  sdk: ^3.11.4

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.9
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^6.0.7
  package_info_plus: ^8.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pub_semver: ^2.2.0
  qr_flutter: ^4.1.0
  file_picker: ^11.0.2
  ffi: ^2.2.0
  super_clipboard: ^0.9.1
  photo_manager: ^3.6.0
  image: ^4.5.0
  crop_your_image: ^2.0.0
  desktop_drop: ^0.6.0
  cross_file: ^0.3.4+1
  video_player: ^2.9.2
  connectivity_plus: ^6.0.5
  video_player_media_kit: ^2.0.0
  # Pinned because transfer admission relies on platform-specific free-space
  # reporting and should not change underneath a security release.
  disk_space_2: 1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_relays.json
    - assets/default_relays.ed25519.sig
  # Signature redesign typography — bundled OFL fonts (offline/deterministic,
  # no runtime fetch). Space Grotesk = display/body, JetBrains Mono = the mono
  # labels/chips/receipts. See assets/fonts/OFL.txt for licenses.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
