[package]
name = "conest_native"
version = "0.1.0"
edition = "2024"
description = "Shared native transport and optical codec core for Conest."
license = "MPL-2.0"
repository = "https://github.com/glitch-228/conest"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Qualification-only: lets CONEST_IROH_TEST_RELAY_ONLY strip IP transports so
# app-level tests must reach peers through Iroh relays. Never enabled in
# shipped builds.
test-relay-only = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
# Ed25519 for Dart (signing.rs): already in the tree through iroh.
ed25519-dalek = "2.2"
flutter_rust_bridge = "2"
hmac = "0.12"
iroh = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "net"] }
# Audited Olm/Megolm (Matrix). Forward-secret pairwise sessions; see
# notes/FORWARD-SECRECY.md.
vodozemac = "0.11"
# Full Matrix client (notes/MATRIX-CLIENT.md): sync, rooms, E2EE, media.
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "0.19", default-features = false }
mime = "0.3"
futures-util = "0.3"
# Tor carrier (M20): onion services and bridges with pluggable transports.
# Its directory store shares matrix-sdk's rusqlite 0.40.
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "pt-client", "bridge-client", "static-sqlite"] }
tor-hsservice = "0.47"
tor-cell = "0.47"
tor-proto = "0.47"
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
safelog = "0.10"
# Arti builds TLS from the process-wide provider, which rustls cannot pick
# while dependencies enable both ring and aws-lc-rs; tor.rs installs ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "windows"))'.dependencies]
crossbeam-queue = "0.3"
opus = "0.4"
# WebRTC AEC3 and noise suppression; Android uses NS when its effect is absent.
sonora = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cpal = "0.18.2"
nokhwa = { version = "0.10.11", features = ["input-native"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native crash reports: the last-chance exception filter.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
# Bluetooth mesh (WinRT).
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Devices_Radios", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
