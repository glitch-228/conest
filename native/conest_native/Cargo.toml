[package]
name = "conest_native"
version = "0.1.0"
edition = "2024"
description = "Shared native transport and optical codec core for Conest."
license = "MPL-2.0"
repository = "https://github.com/glitch-228/conest"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
flutter_rust_bridge = "2"
iroh = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-native"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
