[package]
name = "conest_native"
version = "0.1.0"
edition = "2024"
description = "Shared native transport and optical codec core for Conest."
license = "MPL-2.0"
repository = "https://github.com/glitch-228/conest"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Qualification-only: lets CONEST_IROH_TEST_RELAY_ONLY strip IP transports so
# app-level tests must reach peers through Iroh relays. Never enabled in
# shipped builds.
test-relay-only = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
flutter_rust_bridge = "2"
hmac = "0.12"
iroh = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Audited Olm/Megolm (Matrix). Forward-secret pairwise sessions; see
# notes/FORWARD-SECRECY.md.
vodozemac = "0.11"
# Full Matrix client (notes/MATRIX-CLIENT.md): sync, rooms, E2EE, media.
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "0.19", default-features = false }
mime = "0.3"
futures-util = "0.3"

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "windows"))'.dependencies]
crossbeam-queue = "0.3"
opus = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cpal = "0.18.2"
nokhwa = { version = "0.10.11", features = ["input-native"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }
# Pure-Rust port of WebRTC audio processing (AEC3), the echo canceller used
# by WebRTC-based voice stacks such as Discord's and Telegram's.
sonora = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
