[package]
name = "conest_relay"
version = "0.2.0"
edition = "2024"
description = "Standalone TCP/UDP/HTTP relay for the Conest secure text-exchange prototype."
license = "MPL-2.0"
repository = "https://github.com/glitch-228/conest"
readme = "../../README.md"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# Relay v2 sessions: Noise_NK_25519_ChaChaPoly_SHA256 (notes in RELAY.md).
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
# Sealed UDP (M38-C): already in the tree through snow.
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# TLS on 443 with a decoy site (the outer layer). Ring only: no aws-lc
# toolchain for the relay's cross builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
