[package]
name = "conest_relay"
version = "0.2.0"
edition = "2024"
description = "Standalone TCP/UDP/HTTP relay for the Conest secure text-exchange prototype."
license = "MPL-2.0"
repository = "https://github.com/glitch-228/conest"
readme = "../../README.md"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
